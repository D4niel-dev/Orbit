  <!-- ⚠ LOADED LAST, ON PURPOSE, AND IT IS THE WHOLE v0.9.0 REDESIGN.
       A layer over components.css rather than an edit to it — disabling this one
       <link> gives the previous design back, which is the default. The "New look"
       switch under Settings → Advanced → Experimental Features turns the layer on.
       See the header comment in the file.

       ⚠ It owns the CHROME only. The switch and the profile sidebar are styled in
       components.css, because their markup is class-based in both UIs. -->
  <link id="redesign-css" rel="stylesheet" href="styles/redesign.css?v=20261012b">

  <!-- ⚠ THE LOOK PREFERENCE IS APPLIED HERE, INLINE, BEFORE FIRST PAINT.
       Applied from app.js instead, the app would draw the redesign and then
       visibly switch out of it on every launch — a flash for exactly the people
       who left the beta alone, which is now most of them. This is why the setting
       is read through `orbitAPI.storeGet`, a SYNCHRONOUS IPC through the preload
       bridge, rather than from the SQLite copy the app loads later.

       ⚠⚠ IT FAILS TOWARD THE ORIGINAL UI, AND THAT IS THE WHOLE SAFETY PROPERTY.
       No bridge, no settings, a thrown error, or anything that is not exactly
       `newUI: true` leaves the redesign OFF. The original UI is a complete set of
       stylesheets — it is not an "unstyled app" — so the safe direction to fail in
       is the stable one, and the beta has to be positively asked for.

       ⚠ It is also not the authority — store.js applies the real setting once it
       loads, so a stale or missing value here costs a brief flash, never a wrong
       final state. -->
  <script>
    (function () {
      try {
        var api = window.orbitAPI;
        var settings = (api && api.storeGet) ? api.storeGet('settings') : null;
        if (!settings || settings.newUI !== true) {
          var link = document.getElementById('redesign-css');
          if (link) link.disabled = true;
        }
      } catch (e) { /* leave the redesign off — the original UI is the safe one */ }
    })();
  </script>

  <!-- ⚠ Prism is NOT loaded here any more. Three cdnjs requests — a stylesheet
       and two scripts, none deferred — used to sit in the boot path on every
       launch, blocking first paint to highlight code blocks that most launches
       never show. shared/ui/code-highlight.js loads it the first time a message
       actually contains code. See the note at the top of that file. -->

  <!-- Lucide Icons -->
  <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>

  <!-- QR Code Generator + Decoder (vendored locally — QR pairing must work
       with no internet, which is exactly when it is most useful) -->
  <script src="../node_modules/qrcode-generator/dist/qrcode.js"></script>
  <script>window.QRCode = qrcode;</script>
  <script src="../node_modules/jsqr/dist/jsQR.js"></script>

  <!-- Emoji Picker Element -->
  <script type="module" src="../node_modules/emoji-picker-element/index.js"></script>
  <!-- ⚠ The redesign's OWN picker (js/components/emoji-panel.js) needs the emoji
       DATA, not the library's UI — the library element's look is inside a shadow
       root and cannot be restyled. Only its Database is exposed here, and it comes
       from the same module graph, so nothing extra is fetched. -->
  <script type="module">
    // ⚠ DEFAULT import. `database.js` ends with `export { Database as default }`,
    // so `import { Database }` is undefined — and `new undefined()` fails inside the
    // panel's catch, which then renders "could not be loaded" with no clue why.
    import Database from '../node_modules/emoji-picker-element/database.js';
    window.OrbitEmojiDatabase = Database;
  </script>

          <span style="font-weight:600; font-family:var(--font-display);">Shared Media</span>
          <button id="btn-close-gallery" style="background:transparent; border:none; cursor:pointer; color:var(--text-secondary);"><i data-lucide="x"></i></button>
        </div>
        <div style="display:flex; border-bottom:1px solid var(--border-subtle); padding:0 16px; gap:16px; flex-shrink:0;">

          <div class="gallery-tab" data-tab="links" style="padding:12px 0; cursor:pointer; font-size:13px; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent;">Links</div>
          <button id="btn-gallery-select" title="Select items" style="margin-left:auto; align-self:center; background:transparent; border:none; color:var(--text-secondary); cursor:pointer; font-size:11.5px; display:flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px;" title="Select items"><i data-lucide="list-checks" style="width:15px;height:15px;"></i></button>
        </div>

  <!-- ⚠ THE SHARED COPY, NOT A DESKTOP FORK. `js/utils/sanitize.js` was a stale

       which matched an @handle inside a URL and inside an escaped attribute, so
       `https://suno.com/@d4studio#page=songs` came out with a <span> injected
       INSIDE the href and the whole anchor collapsed into visible markup. The
       shared copy requires whitespace before the @ and two word characters, which
       is why the phone never had the bug. -->
  <script src="../../shared/utils/sanitize.js"></script>
